version: '3.8'

services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: db_admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: indexing_lab
    ports:
      - "5432:5432"

  # PgAdmin is a web-based GUI for Postgres
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
