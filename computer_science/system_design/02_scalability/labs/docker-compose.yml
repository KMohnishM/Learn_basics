version: '3.8'

services:
  # Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web1
      - web2
      - web3

  # Application Instance 1
  web1:
    build: .
    environment:
      - INSTANCE_NAME=Backend-Server-1
    ports:
      - "8001:8000"

  # Application Instance 2
  web2:
    build: .
    environment:
      - INSTANCE_NAME=Backend-Server-2
    ports:
      - "8002:8000"

  # Application Instance 3
  web3:
    build: .
    environment:
      - INSTANCE_NAME=Backend-Server-3
    ports:
      - "8003:8000"
