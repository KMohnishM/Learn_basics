events {
    worker_connections 1024;
}

http {
    # Define our group of backend servers
    upstream backend_servers {
        # By default, Nginx uses Round Robin
        server web1:8000;
        server web2:8000;
        server web3:8000;
        
        # Uncomment the line below to use IP Hash (sticky sessions)
        # ip_hash;
        
        # Uncomment the line below to use Least Connections
        # least_conn;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
