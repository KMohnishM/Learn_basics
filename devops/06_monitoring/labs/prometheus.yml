# Global configuration
global:
  scrape_interval: 15s # By default, scrape targets every 15 seconds.

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's scraping itself! (Prometheus exposes its own metrics)
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # In a real scenario, we would add our Python API here:
  # - job_name: "python-api"
  #   static_configs:
  #     - targets: ["api:8000"]
