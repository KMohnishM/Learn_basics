name: Python CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: "3.9"
    - run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
    - run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - run: pytest

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # NEW STEP: Log in to Docker Hub using GitHub Secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      
    # NEW STEP: Build and Push the Docker image
    - name: Build and push Docker image
      run: |
        # Use the secret username to tag the image properly
        IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/my-python-api:latest"
        
        # Build the image
        docker build -t $IMAGE_NAME .
        
        # Push the image to the remote registry
        docker push $IMAGE_NAME
        
        echo "Successfully deployed image to Docker Hub!"
