version: '3.8'

services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:3000"
    # Wait for the DB to be ready before starting the web server
    depends_on:
      - db
    environment:
      # These must match what we pass to the database!
      - PGUSER=myuser
      - PGPASSWORD=secret
      - PGDATABASE=mydb
      - PGHOST=db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=mydb
    volumes:
      # Named volume so data persists across container restarts!
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

# Declare the named volume
volumes:
  pgdata:
