apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-api-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capstone-api
  template:
    metadata:
      labels:
        app: capstone-api
    spec:
      containers:
      - name: api
        image: capstone-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
