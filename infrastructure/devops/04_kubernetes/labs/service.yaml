apiVersion: v1
kind: Service
metadata:
  name: python-api-service
spec:
  # LoadBalancer tells K8s to ask the cloud provider (or Minikube locally) 
  # for an external IP address we can use in our browser.
  type: LoadBalancer
  
  # The service looks for any pods with the label "app: python-api"
  # and balances traffic between them.
  selector:
    app: python-api
    
  ports:
    - protocol: TCP
      port: 80        # The port the service exposes to the outside world
      targetPort: 8000 # The port the container is listening on
